<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bobux Download</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: Verdana, Arial, sans-serif;
			background: linear-gradient(180deg, #1d95d2, #e8f4ff 46%, #d8d8d8);
			color: #1f2933;
			display: grid;
			place-items: center;

			margin: 0 0 12px;
			font-size: 54px;
			color: #e21b1b;
			letter-spacing: 1px;
			text-shadow: 0 2px 0 #fff;
		}
		p { line-height: 1.55; }
		a.button {
			display: inline-block;
			margin: 10px;
			padding: 15px 24px;
			border-radius: 8px;
			background: #16a34a;
			color: white;
			text-decoration: none;
			font-weight: 700;
			box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
		}
		a.secondary { background: #2563eb; }
		a.gray { background: #4b5563; }
		.note {
			margin-top: 18px;
			font-size: 13px;
			color: #5b6570;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>BOBUX</h1>
		<p>Download the Bobux installer. It installs the launcher, and the launcher downloads the latest game build from the server.</p>
		<p>
			<a class="button" href="/downloads/BobuxSetup.exe">Download Bobux Setup</a>
			<a class="button secondary" href="/downloads/BobuxLauncher-Windows.zip">Launcher ZIP</a>
			<a class="button gray" href="/downloads/Bobux-Windows.zip">Game ZIP</a>
			<a class="button gray" href="/admin.html">Bobux Admin</a>
		</p>
		<p class="note">If Windows warns about an unknown publisher, choose More info and Run anyway.</p>
	</main>
</body>
</html>
