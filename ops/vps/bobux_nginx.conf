server {
	listen 80;
	listen [::]:80;
	server_name admin.109.71.245.162.nip.io pb.109.71.245.162.nip.io pocketbase.109.71.245.162.nip.io;

	client_max_body_size 512m;
	sendfile on;
	tcp_nodelay on;
	keepalive_timeout 65;

	location / {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/bobux;
	client_max_body_size 512m;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;

	location = / {
		try_files /index.html =404;
	}

	location = /health {
		default_type application/json;
		root /opt/bobux-server;
		try_files /heartbeat_status.json @health_fallback;
	}

	location @health_fallback {
		default_type application/json;
		return 200 '{"status":"ok","transport":"websocket","path":"/ws","region":"moscow"}';
	}

	location = /heartbeat-status {
		default_type application/json;
		root /opt/bobux-server;
		try_files /heartbeat_status.json =404;
	}

	location = /godot-log {
		default_type text/plain;
		alias /var/log/bobux/godot.log;
	}

	location /launcher/ {
		alias /var/www/bobux/launcher/;
		add_header Cache-Control "no-store";
	}

	location = /downloads/latest.json {
		alias /var/www/bobux/downloads/latest.json;
		default_type application/json;
		add_header Cache-Control "no-store";
	}

	location /downloads/ {
		alias /var/www/bobux/downloads/;
		add_header Cache-Control "public, max-age=300";
	}

	location /api/ {
		proxy_pass http://127.0.0.1:3000/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	location /ws {
		if ($http_upgrade = "") {
			return 426;
		}

		proxy_pass http://127.0.0.1:9000/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		proxy_socket_keepalive on;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
		send_timeout 86400s;
	}
}
