name: Bobux Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: PC version, or auto for the next patch
        required: true
        default: auto
        type: string
      build:
        description: PC build number, or auto
        required: true
        default: auto
        type: string
      mobile_version:
        description: Android version, or auto
        required: true
        default: auto
        type: string
      mobile_build:
        description: Android build number, or auto
        required: true
        default: auto
        type: string
      launcher_version:
        description: Launcher version, or current
        required: true
        default: current
        type: string
      launcher_build:
        description: Launcher build number, or current
        required: true
        default: current
        type: string
      release_notes:
        description: Short player-facing release notes
        required: true
        default: Stability, Studio, avatar, and multiplayer improvements.
        type: string
      deploy_production:
        description: Publish builds and restart the live Bobux services
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Archive production binaries in a private GitHub Release
        required: true
        default: true
        type: boolean
      allow_redeploy:
        description: Allow reusing an already deployed build number
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bobux-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 150
    environment:
      name: production
      url: http://109.71.245.162/
    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production releases must run from main."
          }

      - name: Checkout Bobux
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Checkout launcher manifest repository
        uses: actions/checkout@v4
        with:
          repository: Pavelord/game
          path: game
          sparse-checkout: launcher
          sparse-checkout-cone-mode: true

      - name: Resolve release numbers
        id: versions
        shell: pwsh
        run: |
          $arguments = @{
            Version = $env:INPUT_VERSION
            Build = $env:INPUT_BUILD
            MobileVersion = $env:INPUT_MOBILE_VERSION
            MobileBuild = $env:INPUT_MOBILE_BUILD
            LauncherVersion = $env:INPUT_LAUNCHER_VERSION
            LauncherBuild = $env:INPUT_LAUNCHER_BUILD
          }
          if ($env:DEPLOY_PRODUCTION -eq "true") { $arguments.Production = $true }
          if ($env:ALLOW_REDEPLOY -eq "true") { $arguments.AllowRedeploy = $true }
          ./tools/ci/resolve_release_versions.ps1 @arguments
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_MOBILE_VERSION: ${{ inputs.mobile_version }}
          INPUT_MOBILE_BUILD: ${{ inputs.mobile_build }}
          INPUT_LAUNCHER_VERSION: ${{ inputs.launcher_version }}
          INPUT_LAUNCHER_BUILD: ${{ inputs.launcher_build }}
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          ALLOW_REDEPLOY: ${{ inputs.allow_redeploy }}

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: .codex-tools/godot-4.7
          key: godot-4.7-windows-release-v1

      - name: Install verified Godot and templates
        shell: pwsh
        run: ./tools/ci/install_godot.ps1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "BOBUX_ANDROID_KEYSTORE_BASE64 is not configured."
          }
          $keystore = Join-Path $env:RUNNER_TEMP "bobux-release.keystore"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          if ((Get-Item -LiteralPath $keystore).Length -lt 1024) {
            throw "Decoded Android keystore is invalid."
          }
          "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          KEYSTORE_BASE64: ${{ secrets.BOBUX_ANDROID_KEYSTORE_BASE64 }}

      - name: Build, package, and smoke test
        shell: pwsh
        run: |
          ./tools/deploy_bobux_release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Build ([int]$env:RELEASE_BUILD) `
            -MobileVersion $env:MOBILE_VERSION `
            -MobileBuild ([int]$env:MOBILE_BUILD) `
            -LauncherVersion $env:LAUNCHER_VERSION `
            -LauncherBuild ([int]$env:LAUNCHER_BUILD) `
            -ReleaseNotes $env:RELEASE_NOTES `
            -SkipUpload
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.BOBUX_ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.BOBUX_ANDROID_KEYSTORE_PASSWORD }}

      - name: Install deployment client
        if: ${{ inputs.deploy_production }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1

      - name: Restore deployment key
        if: ${{ inputs.deploy_production }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_KEY)) {
            throw "BOBUX_DEPLOY_SSH_KEY is not configured."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "bobux-deploy-ed25519"
          [IO.File]::WriteAllText($keyPath, $env:DEPLOY_KEY.Replace("`r", ""), [Text.UTF8Encoding]::new($false))
          "BOBUX_DEPLOY_KEY_FILE=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOBUX_DEPLOY_KNOWN_HOSTS=$env:GITHUB_WORKSPACE\.github\bobux_known_hosts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          DEPLOY_KEY: ${{ secrets.BOBUX_DEPLOY_SSH_KEY }}

      - name: Deploy atomically to production
        if: ${{ inputs.deploy_production }}
        shell: pwsh
        run: |
          python ./tools/deploy_bobux_release_paramiko.py `
            --key-file "$env:BOBUX_DEPLOY_KEY_FILE" `
            --known-hosts "$env:BOBUX_DEPLOY_KNOWN_HOSTS" `
            --version "$env:RELEASE_VERSION" `
            --build "$env:RELEASE_BUILD" `
            --mobile-version "$env:MOBILE_VERSION" `
            --mobile-build "$env:MOBILE_BUILD"

      - name: Verify public production endpoints
        if: ${{ inputs.deploy_production }}
        shell: pwsh
        run: ./tools/verify_bobux_server.ps1

      - name: Create private GitHub Release
        if: ${{ inputs.deploy_production && inputs.publish_github_release }}
        shell: pwsh
        run: |
          $tag = "bobux-v$env:RELEASE_VERSION-build$env:RELEASE_BUILD"
          $title = "Bobux $env:RELEASE_VERSION build $env:RELEASE_BUILD"
          $notes = "$env:RELEASE_NOTES`n`nAndroid: $env:MOBILE_VERSION build $env:MOBILE_BUILD"
          $launcherManifest = "./dist/release/launcher-latest.json"
          $mobileManifest = "./dist/release/mobile-latest.json"
          Copy-Item "./game/launcher/latest.json" $launcherManifest -Force
          Copy-Item "./mobile/latest.json" $mobileManifest -Force
          $assets = @(
            "./dist/release/Bobux-Windows-$env:RELEASE_VERSION-build$env:RELEASE_BUILD.zip",
            "./dist/release/Bobux-Android-$env:MOBILE_VERSION-build$env:MOBILE_BUILD.apk",
            "./dist/BobuxLauncher-Windows.zip",
            $launcherManifest,
            $mobileManifest
          )

          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh GitHub Release assets." }
            gh release edit $tag --target "$env:GITHUB_SHA" --title $title --notes $notes
          } else {
            gh release create $tag $assets `
              --target "$env:GITHUB_SHA" `
              --title $title `
              --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update GitHub Release $tag." }
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bobux-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            dist/release/Bobux-Windows-*.zip
            dist/release/Bobux-Android-*.apk
            dist/BobuxLauncher-Windows.zip
            dist/release/*.log
            game/launcher/latest.json
            mobile/latest.json
