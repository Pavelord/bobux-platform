worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	sendfile on;
	keepalive_timeout 65;

	# Reduce latency for small WebSocket data frames.
	tcp_nodelay on;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	server {
		listen 7860;
		server_name _;
		root /app;

		location = / {
			default_type text/plain;
			return 200 "Bobux dedicated server is running.\n";
		}

		location = /health {
			default_type application/json;
			try_files /heartbeat_status.json @health_fallback;
		}

		location @health_fallback {
			default_type application/json;
			return 200 '{"status":"ok","transport":"websocket","path":"/ws"}';
		}

		location = /heartbeat-status {
			default_type application/json;
			try_files /heartbeat_status.json =404;
		}

		location = /godot-log {
			default_type text/plain;
			alias /tmp/godot-server.log;
		}

		location /ws {
			if ($http_upgrade = "") {
				return 426;
			}
			proxy_pass http://127.0.0.1:9000/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# CRITICAL for WebSocket: disable response buffering so frames
			# are forwarded immediately instead of being held in memory.
			# Without this, nginx buffers upstream responses and stops
			# flushing WebSocket data frames to the client after the
			# initial handshake completes.
			proxy_buffering off;
			proxy_cache off;

			# Keep the upstream (Godot) connection alive.
			proxy_socket_keepalive on;

			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
			send_timeout 86400s;
		}
	}
}
